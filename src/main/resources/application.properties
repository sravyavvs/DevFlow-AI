spring.application.name=agentic-engineering-workbench
server.port=8080
spring.jackson.serialization.indent-output=true

# Local prototype database. Replace with managed database + migrations for production.
spring.datasource.url=jdbc:h2:file:./data/urldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Keep the H2 console disabled by default; use APIs/Swagger for inspection.
spring.h2.console.enabled=false
